<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Pearnly Cowork LINE</title>
    <link rel="stylesheet" href="/static/pearnly-ui.css?v=5" />
    <link rel="stylesheet" href="/static/line-intake-review/batch-review.css?v=2" />
    <link rel="stylesheet" href="/static/line-intake-review/target-select.css?v=2" />
    <link rel="stylesheet" href="/static/cowork-line-intake/intake.css?v=3" />
  </head>
  <body>
    <header class="topbar">
      <strong><span class="mark">P</span> Pearnly Cowork LINE</strong>
      <select id="lang" aria-label="Language">
        <option value="th">ไทย</option>
        <option value="en">English</option>
        <option value="zh">中文</option>
        <option value="ja">日本語</option>
      </select>
    </header>
    <main id="app" aria-live="polite">
      <section id="state" class="state"></section>
      <form id="editor" hidden novalidate></form>
    </main>
    <div id="discard-dialog" class="dialog" hidden aria-hidden="true">
      <div class="dialog__backdrop" data-dialog-cancel></div>
      <section class="dialog__panel" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <h2 id="dialog-title" data-dialog-title></h2>
        <div class="dialog__actions">
          <button
            type="button"
            class="pu-btn pu-btn--secondary"
            data-dialog-cancel
            data-dialog-cancel-button
          ></button>
          <button type="button" class="pu-btn pu-btn--danger" data-dialog-confirm></button>
        </div>
      </section>
    </div>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="/static/line-intake-review/i18n.js?v=1"></script>
    <script src="/static/line-intake-review/liff-runtime.js?v=1"></script>
    <script src="/static/line-intake-review/batch-review.js?v=2"></script>
    <script src="/static/line-intake-review/source-page.js?v=1"></script>
    <script src="/static/line-intake-review/target-select.js?v=3"></script>
    <script src="/static/cowork-line-intake/i18n.js?v=6"></script>
    <script src="/static/cowork-line-intake/field-editor.js?v=3"></script>
    <script src="/static/cowork-line-intake/app.js?v=7"></script>
  </body>
</html>
