name: Manual CD
on:
    workflow_dispatch:
        inputs:
            sha:
                description: Exact 40-character commit SHA currently at origin/master
                required: true
                type: string
permissions:
    contents: read
    id-token: write
concurrency:
    group: manual-deploy-master
    cancel-in-progress: false
jobs:
    deploy:
        if: github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.sha }}
            - name: Validate exact master SHA
              env:
                  GH_TOKEN: ${{ github.token }}
                  DEPLOY_SHA: ${{ inputs.sha }}
              run: |
                  set -euo pipefail
                  test "$GITHUB_REF" = refs/heads/master
                  [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
                  test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
                  test "$(gh api repos/$GITHUB_REPOSITORY/commits/master --jq .sha)" = "$DEPLOY_SHA"
            - uses: google-github-actions/auth@v3
              with:
                  workload_identity_provider: projects/112074003592/locations/global/workloadIdentityPools/pearnly-github/providers/github
                  service_account: pearnly-deploy@pearnly.iam.gserviceaccount.com
            - uses: google-github-actions/setup-gcloud@v3
            - name: Build and publish immutable candidate
              env:
                  DEPLOY_SHA: ${{ inputs.sha }}
              run: |
                  set -euo pipefail
                  gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet
                  image="asia-southeast1-docker.pkg.dev/pearnly/pearnly-app/app:$DEPLOY_SHA"
                  docker build --build-arg "BUILD_SHA=$DEPLOY_SHA" --tag "$image" .
                  docker run --rm --entrypoint python "$image" -m compileall -q app.py core routes services
                  docker run --rm --entrypoint python "$image" -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); b.close(); p.stop()'
                  docker push "$image"
                  digest=$(gcloud artifacts docker images describe "$image" --project=pearnly --format='value(image_summary.digest)')
                  echo "DEPLOY_IMAGE=asia-southeast1-docker.pkg.dev/pearnly/pearnly-app/app@$digest" >> "$GITHUB_ENV"
            - name: Recheck master before production mutation
              env:
                  GH_TOKEN: ${{ github.token }}
                  DEPLOY_SHA: ${{ inputs.sha }}
              run: test "$(gh api repos/$GITHUB_REPOSITORY/commits/master --jq .sha)" = "$DEPLOY_SHA"
            - name: Migrate, deploy and verify
              env:
                  DEPLOY_SHA: ${{ inputs.sha }}
              run: bash deployment/cloud-run/deploy.sh "$DEPLOY_SHA" "$DEPLOY_IMAGE"
