<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 190" role="img" aria-labelledby="title desc">
  <title id="title">Pearl, the Pearnly cat</title>
  <desc id="desc">Orange cat with golden eyes, a green collar and a blue bell, waving hello.</desc>
  <defs>
    <linearGradient id="fur" x1="68" y1="30" x2="184" y2="168" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE1A6"/>
      <stop offset=".55" stop-color="#F6AE5F"/>
      <stop offset="1" stop-color="#E9873F"/>
    </linearGradient>
    <linearGradient id="furLight" x1="80" y1="58" x2="154" y2="145" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF4D9"/>
      <stop offset="1" stop-color="#FFD59A"/>
    </linearGradient>
    <radialGradient id="iris" cx="36%" cy="30%" r="72%">
      <stop stop-color="#FFE378"/>
      <stop offset=".58" stop-color="#D98B17"/>
      <stop offset="1" stop-color="#7D3C0A"/>
    </radialGradient>
    <linearGradient id="bell" x1="111" y1="148" x2="137" y2="176" gradientUnits="userSpaceOnUse">
      <stop stop-color="#65D8F2"/>
      <stop offset=".55" stop-color="#25AEE4"/>
      <stop offset="1" stop-color="#1678B8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#73401B" flood-opacity=".18"/>
    </filter>
  </defs>
  <style>
    .pearl{transform-origin:128px 174px;animation:pearl-breathe 2.7s ease-in-out both}.wave{transform-box:fill-box;transform-origin:32% 82%;animation:pearl-wave 2.7s cubic-bezier(.45,0,.25,1) both}.eyes{transform-box:fill-box;transform-origin:center;animation:pearl-blink 2.7s ease-in-out both}.bell{transform-box:fill-box;transform-origin:50% 0;animation:pearl-bell 2.7s ease-in-out both}.spark{transform-box:fill-box;transform-origin:center;animation:pearl-spark 2.7s ease-out both}@keyframes pearl-breathe{0%,18%{transform:translateY(4px)}55%{transform:translateY(0)}100%{transform:translateY(2px)}}@keyframes pearl-wave{0%,25%{transform:rotate(-13deg)}37%{transform:rotate(10deg)}49%{transform:rotate(-9deg)}61%,100%{transform:rotate(5deg)}}@keyframes pearl-blink{0%,43%,51%,100%{transform:scaleY(1)}47%{transform:scaleY(.08)}}@keyframes pearl-bell{0%,32%,72%,100%{transform:rotate(0)}43%{transform:rotate(9deg)}56%{transform:rotate(-8deg)}}@keyframes pearl-spark{0%,25%{opacity:0;transform:scale(.2) rotate(-25deg)}42%,76%{opacity:1;transform:scale(1) rotate(0)}100%{opacity:0;transform:scale(.6) rotate(20deg)}}@media(prefers-reduced-motion:reduce){.pearl,.wave,.eyes,.bell,.spark{animation:none}}
  </style>
